  nonnegative_factors: true
  init_factors: 0.0
  init_scale: 0.1
  lr: 0.003
  seed: 42
  max_epochs: 10000
  mofaflex_src: "/home/aqoku/projects/code_new/mofaflex"

output:
  dir: "outputs/sln_208_d1_mofaflex_informed"
