  input_format: "h5mu"
  annotations_varm_key: "gene_set_mask"
  enable_gene_set_mask: true
  gene_set_source: "hallmark+mca"
  mca_gmt_url: "https://github.com/bioFAM/mofaflex-analysis/raw/refs/heads/main/msigdb/mmc5_gene.gmt"
